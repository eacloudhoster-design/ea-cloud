openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: EA Cloud API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: mentors
    description: Mentor management
  - name: licenses
    description: License management
  - name: clients
    description: Client management
  - name: superadmin
    description: Super admin operations
  - name: appaccess
    description: App access management
  - name: eas
    description: EA management
  - name: clientapp
    description: Client app operations
  - name: dashboard
    description: Dashboard analytics
  - name: profile
    description: Profile management
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: brokers
    description: Broker server whitelist management
  - name: signals
    description: Trade signal operations
  - name: tradingcontrols
    description: Client trading control settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register mentor account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get mentor profile
      responses:
        "200":
          description: Profile data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorProfile"
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update mentor profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MentorProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorProfile"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get mentor dashboard stats
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Get recent activity feed
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /licenses:
    get:
      operationId: getLicenses
      tags: [licenses]
      summary: Get mentor licenses
      responses:
        "200":
          description: License list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/License"
    post:
      operationId: createLicense
      tags: [licenses]
      summary: Generate a new license key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LicenseInput"
      responses:
        "201":
          description: License created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/License"

  /licenses/{id}:
    get:
      operationId: getLicense
      tags: [licenses]
      summary: Get a license by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: License details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/License"
    patch:
      operationId: updateLicense
      tags: [licenses]
      summary: Update license status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LicenseUpdate"
      responses:
        "200":
          description: Updated license
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/License"
    delete:
      operationId: deleteLicense
      tags: [licenses]
      summary: Delete a license
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /clients:
    get:
      operationId: getClients
      tags: [clients]
      summary: Get mentor clients
      responses:
        "200":
          description: Client list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get client by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /superadmin/dashboard:
    get:
      operationId: getSuperAdminDashboard
      tags: [superadmin]
      summary: Get super admin dashboard stats
      responses:
        "200":
          description: Super admin dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuperAdminDashboard"

  /superadmin/signal-queue:
    get:
      operationId: getSignalQueue
      tags: [superadmin]
      summary: Get durable signal execution queue status and recent signals
      responses:
        "200":
          description: Signal queue status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalQueue"

  /superadmin/mentors:
    get:
      operationId: getSuperAdminMentors
      tags: [superadmin]
      summary: Get all mentors
      responses:
        "200":
          description: All mentors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MentorWithStats"

  /superadmin/mentors/{id}/approve:
    post:
      operationId: approveMentor
      tags: [superadmin]
      summary: Approve a mentor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Mentor approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorWithStats"

  /superadmin/mentors/{id}/reject:
    post:
      operationId: rejectMentor
      tags: [superadmin]
      summary: Reject a mentor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectMentorInput"
      responses:
        "200":
          description: Mentor rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorWithStats"

  /superadmin/mentors/{id}/suspend:
    post:
      operationId: suspendMentor
      tags: [superadmin]
      summary: Suspend a mentor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Mentor suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorWithStats"

  /superadmin/mentors/{id}/strike:
    post:
      operationId: issueMentorStrike
      tags: [superadmin]
      summary: Issue a strike to a mentor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrikeInput"
      responses:
        "200":
          description: Strike issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorWithStats"

  /superadmin/mentors/{id}/remove:
    delete:
      operationId: removeMentor
      tags: [superadmin]
      summary: Permanently remove a mentor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Mentor removed

  /superadmin/mentors/{id}/license-limit:
    patch:
      operationId: updateMentorLicenseLimit
      tags: [superadmin]
      summary: Update mentor license limit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LicenseLimitInput"
      responses:
        "200":
          description: License limit updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorWithStats"

  /superadmin/app-access:
    get:
      operationId: getAppAccessRequests
      tags: [appaccess]
      summary: Get all app access requests
      responses:
        "200":
          description: App access requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppAccessRequest"

  /superadmin/app-access/{id}/approve:
    post:
      operationId: approveAppAccess
      tags: [appaccess]
      summary: Approve app access
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: App access approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppAccessRequest"

  /superadmin/app-access/{id}/reject:
    post:
      operationId: rejectAppAccess
      tags: [appaccess]
      summary: Reject app access
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: App access rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppAccessRequest"

  /eas:
    get:
      operationId: getEas
      tags: [eas]
      summary: Get mentor's EAs
      responses:
        "200":
          description: EA list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ea"
    post:
      operationId: createEa
      tags: [eas]
      summary: Create a new EA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EaInput"
      responses:
        "201":
          description: EA created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ea"

  /eas/{id}:
    patch:
      operationId: updateEa
      tags: [eas]
      summary: Update an EA
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EaUpdate"
      responses:
        "200":
          description: Updated EA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ea"
    delete:
      operationId: deleteEa
      tags: [eas]
      summary: Delete an EA
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /symbol-pairs:
    get:
      operationId: getSymbolPairs
      tags: [symbolpairs]
      summary: Get mentor's trading pairs and broker symbol variations
      responses:
        "200":
          description: Symbol pair list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SymbolPair"
    post:
      operationId: createSymbolPair
      tags: [symbolpairs]
      summary: Create a trading pair with broker symbol variations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SymbolPairInput"
      responses:
        "201":
          description: Symbol pair created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SymbolPair"

  /symbol-pairs/{id}:
    patch:
      operationId: updateSymbolPair
      tags: [symbolpairs]
      summary: Update a trading pair
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SymbolPairUpdate"
      responses:
        "200":
          description: Updated symbol pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SymbolPair"
    delete:
      operationId: deleteSymbolPair
      tags: [symbolpairs]
      summary: Delete a trading pair
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /app-access/register:
    post:
      operationId: requestAppAccess
      tags: [appaccess]
      summary: Request app access (mobile user registration)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppAccessInput"
      responses:
        "201":
          description: Request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppAccessRequest"

  /app/register:
    post:
      operationId: appRegister
      tags: [clientapp]
      summary: Client app registration with subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppRegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppAuthResponse"

  /app/login:
    post:
      operationId: appLogin
      tags: [clientapp]
      summary: Client app login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppAuthResponse"

  /app/me:
    get:
      operationId: appGetMe
      tags: [clientapp]
      summary: Get current app client
      responses:
        "200":
          description: Current client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppClient"

  /app/activate:
    post:
      operationId: appActivateLicense
      tags: [clientapp]
      summary: Activate license key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppActivateInput"
      responses:
        "200":
          description: License activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppClient"

  /app/dashboard:
    get:
      operationId: appGetDashboard
      tags: [clientapp]
      summary: Get client app dashboard (mentor EAs)
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppDashboard"

  /app/broker-servers:
    get:
      operationId: getPublicBrokerServers
      tags: [brokers]
      summary: List all active whitelisted broker servers (public)
      responses:
        "200":
          description: List of active broker servers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrokerServer"

  /superadmin/broker-servers:
    get:
      operationId: superAdminListBrokerServers
      tags: [brokers, superadmin]
      summary: List all broker servers including inactive (superadmin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Full list of broker servers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrokerServer"
    post:
      operationId: superAdminAddBrokerServer
      tags: [brokers, superadmin]
      summary: Add a broker server to the whitelist
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrokerServerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerServer"

  /superadmin/broker-servers/{id}:
    patch:
      operationId: superAdminUpdateBrokerServer
      tags: [brokers, superadmin]
      summary: Update a broker server
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrokerServerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerServer"
    delete:
      operationId: superAdminDeleteBrokerServer
      tags: [brokers, superadmin]
      summary: Remove a broker server from the whitelist
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /app/trading-controls:
    get:
      operationId: getTradingControls
      tags: [tradingcontrols]
      summary: Get client trading control settings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Trading controls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingControls"
    patch:
      operationId: updateTradingControls
      tags: [tradingcontrols]
      summary: Update client trading control settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradingControlsUpdate"
      responses:
        "200":
          description: Updated controls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingControls"

  /app/mt5-connect:
    post:
      operationId: mt5Connect
      tags: [tradingcontrols]
      summary: Connect MT5 account (validates server against whitelist)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Mt5ConnectInput"
      responses:
        "200":
          description: Connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mt5ConnectResult"
        "403":
          description: Server not on approved whitelist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /app/symbol-configs:
    get:
      operationId: getSymbolConfigs
      tags: [tradingcontrols]
      summary: Get available trading pairs and the client's broker symbol selections
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Symbol configs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientSymbolConfig"
    patch:
      operationId: updateSymbolConfigs
      tags: [tradingcontrols]
      summary: Save the client's broker symbol selections and custom lot sizes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SymbolConfigsUpdate"
      responses:
        "200":
          description: Updated symbol configs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientSymbolConfig"

  /app/mt5-disconnect:
    post:
      operationId: mt5Disconnect
      tags: [tradingcontrols]
      summary: Disconnect MT5 account
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected:
                    type: boolean

  /signals/webhook:
    post:
      operationId: tradeSignalWebhook
      tags: [signals]
      summary: Receive trade signal from mentor MT5 EA (authenticated via x-api-key header)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeSignalWebhookInput"
      responses:
        "201":
          description: Signal received
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                  id:
                    type: integer

  /signals/recent:
    get:
      operationId: getRecentSignals
      tags: [signals]
      summary: Get recent trade signals for authenticated mentor
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recent signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TradeSignal"

  /app/signals:
    get:
      operationId: appGetSignals
      tags: [signals, clientapp]
      summary: Get recent signals for a mentor (client app)
      parameters:
        - name: mentorId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recent signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TradeSignal"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        role:
          type: string
          enum: [mentor, superadmin]

    RegisterInput:
      type: object
      required: [firstName, lastName, email, password, mentorName]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        mentorName:
          type: string
        phone:
          type: string

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string

    User:
      type: object
      required: [id, email, role, status]
      properties:
        id:
          type: integer
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [mentor, superadmin, client]
        status:
          type: string
          enum: [pending, approved, rejected, suspended]
        createdAt:
          type: string
          format: date-time

    MentorProfile:
      type: object
      required: [id, email]
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        mentorName:
          type: string
        robotName:
          type: string
        robotTagline:
          type: string
        backgroundImageUrl:
          type: ["string", "null"]
        webhookUrl:
          type: ["string", "null"]
        apiKey:
          type: ["string", "null"]
        status:
          type: string
        licenseLimit:
          type: integer
        createdAt:
          type: string
          format: date-time

    MentorProfileUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
