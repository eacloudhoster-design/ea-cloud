<!DOCTYPE html>
<html lang="en" style="background-color: #000;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="preload" as="image" href="%BASE_URL%ea-cloud-logo.jpeg" fetchpriority="high" />
    <!-- Paint the existing cropped mark before the application module arrives.
         :empty hands off atomically when React mounts; no second overlay or timer. -->
    <style id="ea-startup-first-paint">
      #root:empty { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; }
      #root:empty::before {
        content: ""; width: min(84vw, 460px, 140vh); aspect-ratio: 1254 / 690;
        background: url("/ea-cloud-logo.jpeg") center 26.59574468% / 100% auto no-repeat;
        transform: scale(.88);
      }
      @media (prefers-reduced-motion: reduce) { #root:empty::before { transform: none; } }
    </style>
    <title>EA Cloud App</title>
    <meta name="description" content="EA Cloud App — built on Replit. Update this description to reflect the app." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="EA Cloud App" />
    <meta property="og:description" content="EA Cloud App — built on Replit. Update this description to reflect the app." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EA Cloud App" />
    <meta name="twitter:description" content="EA Cloud App — built on Replit. Update this description to reflect the app." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body style="background-color: var(--ea-page-background-color, #000); margin: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
