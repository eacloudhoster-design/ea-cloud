kind = "web"
previewPath = "/"
title = "EA Cloud"
version = "1.0.0"
id = "artifacts/ea-cloud"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24322

[services.development]
run = "pnpm --filter @workspace/ea-cloud run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ea-cloud", "run", "build" ]
publicDir = "artifacts/ea-cloud/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24322"
BASE_PATH = "/"
